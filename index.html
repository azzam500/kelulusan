<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelulusan SMA Negeri 1 Padangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sman: {
                50: '#f0fdf4',
                100: '#dcfce7',
                500: '#22c55e',
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <script type="importmap">
{

    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "jspdf": "https://esm.sh/jspdf@^4.0.0",
    "canvas-confetti": "https://esm.sh/canvas-confetti@^1.9.4",
    "qrcode": "https://esm.sh/qrcode@^1.5.4"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-800 antialiased">
    <div id="root"></div>
  </body>
</html>
